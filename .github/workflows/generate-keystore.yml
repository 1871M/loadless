name: 🔑 Generate Keystore (run once)

on:
  workflow_dispatch:
    inputs:
      store_password:
        description: 'Mot de passe du keystore (min 8 caractères)'
        required: true
      key_password:
        description: 'Mot de passe de la clé (min 8 caractères)'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Generate keystore
        id: gen
        run: |
          keytool -genkey -v \
            -keystore loadless-release.keystore \
            -alias loadless \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "${{ inputs.store_password }}" \
            -keypass "${{ inputs.key_password }}" \
            -dname "CN=LoadLess, OU=LoadLess, O=LoadLess, L=Local, ST=Local, C=FR" \
            -noprompt
          echo "b64=$(base64 -w 0 loadless-release.keystore)" >> $GITHUB_OUTPUT

      - name: Write secrets to workflow summary
        run: |
          B64="${{ steps.gen.outputs.b64 }}"
          B64_LEN=${#B64}
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## ✅ Keystore généré — Ajoutez ces 4 secrets dans votre repo

          **github.com/1871M/loadless → Settings → Secrets and variables → Actions**

          | Nom du secret | Valeur |
          |--------------|--------|
          | \`KEYSTORE_BASE64\` | *(voir ci-dessous — ${B64_LEN} caractères)* |
          | \`KEYSTORE_STORE_PASSWORD\` | *(votre store_password saisi)* |
          | \`KEYSTORE_KEY_ALIAS\` | \`loadless\` |
          | \`KEYSTORE_KEY_PASSWORD\` | *(votre key_password saisi)* |

          ### Valeur de KEYSTORE_BASE64 (${B64_LEN} caractères — copiez TOUT) :
          EOF
          echo '```' >> $GITHUB_STEP_SUMMARY
          printf '%s\n' "$B64" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ⚠️ Vérifiez que le secret collé fait bien **${B64_LEN} caractères**. Un base64 tronqué = keystore corrompu." >> $GITHUB_STEP_SUMMARY

name: 🔑 Generate Keystore (run once)

on:
  workflow_dispatch:
    inputs:
      store_password:
        description: 'Mot de passe du keystore (min 8 caractères)'
        required: true
      key_password:
        description: 'Mot de passe de la clé (min 8 caractères)'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Generate keystore
        id: gen
        run: |
          keytool -genkey -v \
            -keystore loadless-release.keystore \
            -alias loadless \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "${{ inputs.store_password }}" \
            -keypass "${{ inputs.key_password }}" \
            -dname "CN=LoadLess, OU=LoadLess, O=LoadLess, L=Local, ST=Local, C=FR" \
            -noprompt
          echo "b64=$(base64 -w 0 loadless-release.keystore)" >> $GITHUB_OUTPUT

      - name: Save secrets via GitHub API
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.KEYSTORE_SETUP_TOKEN }}
          script: |
            const sodium = require('tweetsodium');

            async function setSecret(name, value) {
              const { data: pubKey } = await github.rest.actions.getRepoPublicKey({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              const enc = Buffer.from(
                sodium.seal(
                  Buffer.from(value),
                  Buffer.from(pubKey.key, 'base64')
                )
              ).toString('base64');
              await github.rest.actions.createOrUpdateRepoSecret({
                owner: context.repo.owner,
                repo: context.repo.repo,
                secret_name: name,
                encrypted_value: enc,
                key_id: pubKey.key_id,
              });
            }

            await setSecret('KEYSTORE_BASE64',         '${{ steps.gen.outputs.b64 }}');
            await setSecret('KEYSTORE_STORE_PASSWORD', '${{ inputs.store_password }}');
            await setSecret('KEYSTORE_KEY_ALIAS',      'loadless');
            await setSecret('KEYSTORE_KEY_PASSWORD',   '${{ inputs.key_password }}');
            core.notice('✅ 4 secrets enregistrés dans le repo.');

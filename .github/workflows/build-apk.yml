name: 🤖 Build & Release APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'manifest.json'
      - 'sw.js'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pour créer les releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Add Android platform (if not present)
        run: |
          if [ ! -f android/app/build.gradle ]; then
            npx cap add android
          fi

      - name: Copy custom Android files
        run: |
          cp -f android/app/src/main/AndroidManifest.xml \
            android/app/src/main/AndroidManifest.xml.bak 2>/dev/null || true
          # Les fichiers XML custom sont déjà dans le repo
          echo "Custom Android files already in place."

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > loadless-release.keystore

      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/loadless-release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEYSTORE_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEYSTORE_KEY_PASSWORD }}

      - name: Rename APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APK_SRC=android/app/build/outputs/apk/release/app-release.apk
          APK_DST=loadless-v${VERSION}.apk
          cp "$APK_SRC" "$APK_DST"
          echo "APK_PATH=$APK_DST" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-build${{ github.run_number }}
          name: LoadLess v${{ env.VERSION }} (build ${{ github.run_number }})
          body: |
            ## LoadLess v${{ env.VERSION }}

            ### Installation Android
            1. Téléchargez `loadless-v${{ env.VERSION }}.apk`
            2. Activez *Sources inconnues* dans Paramètres → Sécurité
            3. Installez l'APK

            ### Changements
            Commit: ${{ github.sha }}
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: false

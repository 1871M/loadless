name: 🤖 Build & Release APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'public/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'vite.config.js'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pour créer les releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Install ImageMagick (PNG resize)
        run: sudo apt-get install -y imagemagick

      - name: Generate app icons from PNG
        run: |
          SRC=public/assets/icon.png
          # Web PWA icons
          mkdir -p icons
          for SIZE in 72 96 128 144 152 192 384 512; do
            convert "$SRC" -resize ${SIZE}x${SIZE} "icons/icon-${SIZE}.png"
            echo "✅ icons/icon-${SIZE}.png"
          done
          # Keep logo.png in sync (used by loader)
          convert "$SRC" -resize 192x192 "public/assets/logo.png"
          echo "✅ assets/logo.png"

      - name: Inject google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          echo "✅ google-services.json injecté depuis le secret"

      - name: Add Android platform
        run: |
          # Sauvegarde des fichiers custom trackés dans git
          mkdir -p /tmp/android-custom/app/src/main/res/xml
          mkdir -p /tmp/android-custom/app/src/main/java/fr/loadless/app
          cp android/app/src/main/AndroidManifest.xml \
            /tmp/android-custom/app/src/main/AndroidManifest.xml 2>/dev/null || true
          cp android/app/src/main/res/xml/file_paths.xml \
            /tmp/android-custom/app/src/main/res/xml/file_paths.xml 2>/dev/null || true
          cp android/app/src/main/res/xml/network_security_config.xml \
            /tmp/android-custom/app/src/main/res/xml/network_security_config.xml 2>/dev/null || true
          cp android/app/src/main/java/fr/loadless/app/MainActivity.kt \
            /tmp/android-custom/app/src/main/java/fr/loadless/app/MainActivity.kt 2>/dev/null || true
          cp android/app/google-services.json \
            /tmp/android-custom/app/google-services.json 2>/dev/null || true
          # Suppression du dossier partiel puis recréation complète
          rm -rf android
          npx cap add android
          # Restauration des fichiers custom
          cp /tmp/android-custom/app/src/main/AndroidManifest.xml \
            android/app/src/main/AndroidManifest.xml
          cp /tmp/android-custom/app/src/main/res/xml/file_paths.xml \
            android/app/src/main/res/xml/file_paths.xml
          cp /tmp/android-custom/app/src/main/res/xml/network_security_config.xml \
            android/app/src/main/res/xml/network_security_config.xml
          mkdir -p android/app/src/main/java/fr/loadless/app
          cp /tmp/android-custom/app/src/main/java/fr/loadless/app/MainActivity.kt \
            android/app/src/main/java/fr/loadless/app/MainActivity.kt
          cp /tmp/android-custom/app/google-services.json \
            android/app/google-services.json

      - name: Inject custom launcher icons into Android
        run: |
          SRC=public/assets/icon.png
          RES=android/app/src/main/res
          # Standard mipmap sizes
          declare -A SIZES=(
            [mipmap-mdpi]=48
            [mipmap-hdpi]=72
            [mipmap-xhdpi]=96
            [mipmap-xxhdpi]=144
            [mipmap-xxxhdpi]=192
          )
          for DIR in "${!SIZES[@]}"; do
            SIZE=${SIZES[$DIR]}
            # Réduit à 90% + centre sur fond blanc pour éviter le rognage du launcher
            INNER=$((SIZE*90/100))
            mkdir -p "$RES/$DIR"
            convert "$SRC" -resize ${INNER}x${INNER} -gravity center -background white -extent ${SIZE}x${SIZE} "$RES/$DIR/ic_launcher.png"
            convert "$SRC" -resize ${INNER}x${INNER} -gravity center -background white -extent ${SIZE}x${SIZE} "$RES/$DIR/ic_launcher_round.png"
            echo "✅ $RES/$DIR/ic_launcher.png (${SIZE}px, inner ${INNER}px)"
          done
          # Adaptive icon foreground : logo à 66% du canvas (safe zone Android)
          # 432 × 0.66 = ~285px — garantit que le logo reste visible quel que soit le masque (cercle, squircle…)
          mkdir -p "$RES/mipmap-anydpi-v26"
          convert "$SRC" -resize 285x285 -gravity center -background white -extent 432x432 "$RES/mipmap-xxxhdpi/ic_launcher_foreground.png"
          echo "✅ Adaptive foreground injected (285px dans 432px safe zone)"

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate keystore
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          keytool -genkey -v \
            -keystore loadless-release.keystore \
            -alias loadless \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Loadless, OU=Loadless, O=Loadless, L=Local, ST=Local, C=FR" \
            -noprompt
          echo "✅ Keystore généré : $(wc -c < loadless-release.keystore) octets"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/loadless-release.keystore
          STORE_PASS: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease \
            "-Pandroid.injected.signing.store.file=$KEYSTORE_PATH" \
            "-Pandroid.injected.signing.store.password=$STORE_PASS" \
            "-Pandroid.injected.signing.key.alias=$KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$KEY_PASS"

      - name: Rename APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APK_SRC=android/app/build/outputs/apk/release/app-release.apk
          APK_DST=loadless-v${VERSION}.apk
          cp "$APK_SRC" "$APK_DST"
          echo "APK_PATH=$APK_DST" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-build${{ github.run_number }}
          name: Loadless v${{ env.VERSION }} (build ${{ github.run_number }})
          body: |
            ## Loadless v${{ env.VERSION }}

            ### Installation Android
            1. Téléchargez `loadless-v${{ env.VERSION }}.apk`
            2. Activez *Sources inconnues* dans Paramètres → Sécurité
            3. Installez l'APK

            ### Changements
            Commit: ${{ github.sha }}
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: false

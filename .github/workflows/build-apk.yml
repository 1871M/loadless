name: 🤖 Build & Release APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'manifest.json'
      - 'sw.js'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pour créer les releases

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: |
          # Sauvegarde des fichiers custom trackés dans git
          mkdir -p /tmp/android-custom/app/src/main/res/xml
          cp android/app/src/main/AndroidManifest.xml \
            /tmp/android-custom/app/src/main/AndroidManifest.xml 2>/dev/null || true
          cp android/app/src/main/res/xml/file_paths.xml \
            /tmp/android-custom/app/src/main/res/xml/file_paths.xml 2>/dev/null || true
          cp android/app/src/main/res/xml/network_security_config.xml \
            /tmp/android-custom/app/src/main/res/xml/network_security_config.xml 2>/dev/null || true
          # Suppression du dossier partiel puis recréation complète
          rm -rf android
          npx cap add android
          # Restauration des fichiers custom (AndroidManifest sans GAFAM, file_paths, network_security)
          cp /tmp/android-custom/app/src/main/AndroidManifest.xml \
            android/app/src/main/AndroidManifest.xml
          cp /tmp/android-custom/app/src/main/res/xml/file_paths.xml \
            android/app/src/main/res/xml/file_paths.xml
          cp /tmp/android-custom/app/src/main/res/xml/network_security_config.xml \
            android/app/src/main/res/xml/network_security_config.xml

      - name: Prepare webDir
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/ 2>/dev/null || true
          cp sw.js www/ 2>/dev/null || true
          [ -d assets ] && cp -r assets www/ || true
          [ -f privacy_policy.html ] && cp privacy_policy.html www/ || true

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > loadless-release.keystore

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/loadless-release.keystore
          STORE_PASS: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease \
            "-Pandroid.injected.signing.store.file=$KEYSTORE_PATH" \
            "-Pandroid.injected.signing.store.password=$STORE_PASS" \
            "-Pandroid.injected.signing.key.alias=$KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$KEY_PASS"

      - name: Rename APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APK_SRC=android/app/build/outputs/apk/release/app-release.apk
          APK_DST=loadless-v${VERSION}.apk
          cp "$APK_SRC" "$APK_DST"
          echo "APK_PATH=$APK_DST" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-build${{ github.run_number }}
          name: LoadLess v${{ env.VERSION }} (build ${{ github.run_number }})
          body: |
            ## LoadLess v${{ env.VERSION }}

            ### Installation Android
            1. Téléchargez `loadless-v${{ env.VERSION }}.apk`
            2. Activez *Sources inconnues* dans Paramètres → Sécurité
            3. Installez l'APK

            ### Changements
            Commit: ${{ github.sha }}
          files: ${{ env.APK_PATH }}
          draft: false
          prerelease: false

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="38%" cy="32%" r="70%" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1024" y2="1024">
      <stop offset="0%" stop-color="#8B7FE8"/>
      <stop offset="100%" stop-color="#4A3DB0"/>
    </radialGradient>
    <linearGradient id="bglin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7A6EE0"/>
      <stop offset="100%" stop-color="#4A3DB0"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="1024" height="1024" rx="224"/>
    </clipPath>
  </defs>

  <!-- Background rounded square -->
  <rect width="1024" height="1024" rx="224" fill="url(#bglin)"/>

  <!-- Subtle inner glow -->
  <ellipse cx="400" cy="320" rx="380" ry="300" fill="rgba(255,255,255,0.08)"/>

  <!-- Coral accent strip at bottom -->
  <rect x="0" y="840" width="1024" height="184" rx="0" fill="#F2A38F" opacity="0.22" clip-path="url(#round)"/>

  <!-- House icon — white, centered, bold -->
  <!-- Scale: 24x24 viewBox → ~480px wide, centered at 512,512 -->
  <!-- Transform: scale 20, center offset -->
  <g transform="translate(512,490) scale(20,20) translate(-12,-12)">
    <!-- House walls + roof -->
    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
          fill="none" stroke="white" stroke-width="1.6"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Door -->
    <polyline points="9 22 9 12 15 12 15 22"
              fill="none" stroke="white" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark "Ll" — subtle, below icon -->
  <text x="512" y="760" font-family="Georgia, serif" font-size="96" font-weight="700"
        fill="rgba(255,255,255,0.55)" text-anchor="middle" letter-spacing="8">loadless</text>
</svg>
